name: Build official PG18 VectorChord and pgvector with Cloud9 SSD/HDD safety
on:
  push:
    branches: [main]
  schedule:
    - cron: "13 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: cloud9-immich-postgres-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify public license, privacy and exact PostgreSQL extension baseline
        run: python3 tests/privacy.py
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build from official PostgreSQL and extension packages on CI
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          load: true
          platforms: linux/amd64
          tags: local/cloud9-immich-postgres:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate PostgreSQL 18 extensions SSD and runtime health on empty data
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint postgres local/cloud9-immich-postgres:test --version | grep -F "PostgreSQL) 18"
          mkdir -p "$RUNNER_TEMP/pgdata"
          docker run --detach --name cloud9-immich-pg-canary \
            -e POSTGRES_DB=immich -e POSTGRES_USER=immich -e POSTGRES_PASSWORD=test-only-in-ci \
            -e DB_STORAGE_TYPE=SSD -v "$RUNNER_TEMP/pgdata:/var/lib/postgresql" \
            local/cloud9-immich-postgres:test >/dev/null
          status=no
          for i in $(seq 1 100); do
            if docker exec cloud9-immich-pg-canary pg_isready -U immich -d immich >/dev/null 2>&1;then
              status=yes; break
            fi
            sleep 2
          done
          if [ "$status" != yes ];then docker logs --tail 100 cloud9-immich-pg-canary;exit 1;fi
          docker exec cloud9-immich-pg-canary psql -U immich -d immich -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS vector;' \
            -c 'CREATE EXTENSION IF NOT EXISTS vchord CASCADE;' \
            -c "SELECT extname,extversion FROM pg_extension WHERE extname IN ('vector','vchord') ORDER BY extname;" \
            | tee /tmp/extensions.log
          grep -F 'vchord' /tmp/extensions.log
          grep -F 'vector' /tmp/extensions.log
          docker exec cloud9-immich-pg-canary psql -U immich -d immich -v ON_ERROR_STOP=1 -tAc "SELECT extversion FROM pg_extension WHERE extname='vchord'" | grep -Fx '1.1.1'
          docker exec cloud9-immich-pg-canary psql -U immich -d immich -v ON_ERROR_STOP=1 -tAc "SELECT extversion FROM pg_extension WHERE extname='vector'" | grep -Fx '0.8.5'
          docker exec cloud9-immich-pg-canary psql -U immich -d immich -v ON_ERROR_STOP=1 -c 'CREATE TABLE ci_restart_canary(id bigint primary key, label text NOT NULL); INSERT INTO ci_restart_canary VALUES (7, $$persisted$$);'
          docker restart cloud9-immich-pg-canary >/dev/null
          ready=no
          for i in $(seq 1 45);do
            if docker exec cloud9-immich-pg-canary pg_isready -U immich -d immich >/dev/null 2>&1;then ready=yes;break;fi
            sleep 2
          done
          test "$ready" = yes
          docker exec cloud9-immich-pg-canary psql -U immich -d immich -v ON_ERROR_STOP=1 -tAc 'SELECT label FROM ci_restart_canary WHERE id=7' | grep -Fx 'persisted'
          echo CLOUD9_IMMICH_POSTGRES_RESTART_WAL_AND_EXTENSION_VERSION_E2E_PASS
          healthy=no
          for i in $(seq 1 40);do
            if [ "$(docker inspect cloud9-immich-pg-canary --format '{{.State.Health.Status}}')" = healthy ];then
              healthy=yes;break
            fi
            sleep 3
          done
          if [ "$healthy" != yes ];then docker logs --tail 90 cloud9-immich-pg-canary;exit 1;fi
          docker rm -f cloud9-immich-pg-canary >/dev/null
          echo CLOUD9_IMMICH_PG18_VECTORCHORD_VECTOR_SSD_HEALTH_PASS
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested multiarchitecture GHCR rolling and immutable release
        shell: bash
        run: |
          set -euo pipefail
          ref="ghcr.io/godsquantum/cloud9-immich-postgres:pg18-vchord1.1.1-sha-${GITHUB_SHA:0:12}-run-$GITHUB_RUN_ID"
          docker buildx build --platform linux/amd64,linux/arm64 --pull \
            --label "org.opencontainers.image.source=https://github.com/GodsQuantum/Cloud9-Immich-Postgres" \
            --tag "$ref" --tag "ghcr.io/godsquantum/cloud9-immich-postgres:latest" --push .
          echo "Published tested immutable image: $ref" >> "$GITHUB_STEP_SUMMARY"
          echo "Rolling :latest published only after clean CI, extension version and restarted PostgreSQL WAL E2E. Production PG18 70,732 asset baseline was separately validated on 2026-11-12." >> "$GITHUB_STEP_SUMMARY"
          echo IMMICH_PG18_GHCR_LATEST_AND_IMMUTABLE_RELEASE_PUBLISHED
